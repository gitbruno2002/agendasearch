<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AgendaSearch — Pautas Inteligentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0B1220;--bg2:#111827;--bg3:#1F2937;
--p1:#7C3AED;--p2:#8B5CF6;--p3:#A78BFA;
--c1:#06B6D4;--c2:#22D3EE;--c3:#67E8F9;
--t1:#E5E7EB;--t2:#9CA3AF;--t3:#6B7280;
--ok:#22C55E;--warn:#F59E0B;--err:#EF4444;
--glow-p:0 0 12px rgba(124,58,237,0.45);
--glow-c:0 0 12px rgba(6,182,212,0.45);
--r:8px;--r-lg:12px;--r-xl:16px;
--font:'Inter',system-ui,sans-serif;
--font-h:'Space Grotesk',system-ui,sans-serif;
}
html,body,#root{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
*::-webkit-scrollbar{width:4px}
*::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;background:var(--bg);border-right:1px solid var(--bg3);flex-shrink:0;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;background:var(--bg)}

/* ── SIDEBAR ── */
.sb-logo{padding:20px 16px 16px;border-bottom:1px solid var(--bg3);display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--p1),var(--c1));display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:13px;font-weight:700;color:#fff;box-shadow:var(--glow-p);flex-shrink:0}
.sb-logo-text h1{font-family:var(--font-h);font-size:15px;font-weight:700;color:var(--t1);letter-spacing:0.2px}
.sb-logo-text h1 span{color:var(--c2)}
.sb-logo-text p{font-size:10px;color:var(--t3);margin-top:2px}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-sec{font-size:9.5px;font-weight:600;color:var(--t3);letter-spacing:1.4px;text-transform:uppercase;padding:0 8px;margin:10px 0 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--t3);font-size:13px;transition:all 0.15s;user-select:none;font-weight:400}
.sb-item:hover{background:var(--bg3);color:var(--t1)}
.sb-item.active{background:linear-gradient(90deg,rgba(124,58,237,0.25),rgba(6,182,212,0.1));color:var(--t1);font-weight:500;border:1px solid rgba(124,58,237,0.3);box-shadow:var(--glow-p)}
.sb-item.active svg{color:var(--p3)}
.sb-item svg{width:15px;height:15px;flex-shrink:0;color:var(--t3);transition:color 0.15s}
.sb-item:hover svg{color:var(--c2)}
.sb-user{padding:12px;border-top:1px solid var(--bg3)}
.sb-urow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--c1));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;box-shadow:var(--glow-p)}
.av.sm{width:24px;height:24px;font-size:10px}
.sb-uname{color:var(--t1);font-size:12px;font-weight:500}
.sb-urole{color:var(--t3);font-size:10px}
.sb-logout{width:100%;padding:6px;background:transparent;border:1px solid var(--bg3);border-radius:var(--r);color:var(--t3);font-size:11px;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.sb-logout:hover{border-color:var(--err);color:var(--err)}

/* ── TOPBAR ── */
.topbar{background:var(--bg);border-bottom:1px solid var(--bg3);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h2{font-family:var(--font-h);font-size:17px;font-weight:700;color:var(--t1)}
.topbar p{font-size:12px;color:var(--t3);margin-top:2px}

/* ── CONTENT ── */
.content{padding:22px 24px}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-lg);padding:20px}
.card+.card{margin-top:12px}
.card-title{font-family:var(--font-h);font-size:13px;font-weight:600;margin-bottom:16px;color:var(--t1)}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;font-family:var(--font);border:none;font-weight:500}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:var(--p1);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--p2);box-shadow:var(--glow-p)}
.btn-secondary{background:transparent;border:1px solid var(--c1);color:var(--c1)}
.btn-secondary:hover{background:rgba(6,182,212,0.1);box-shadow:var(--glow-c)}
.btn-ghost{background:transparent;border:1px solid var(--bg3);color:var(--t2)}
.btn-ghost:hover{background:var(--bg3);color:var(--t1)}
.btn-danger{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:var(--err)}
.btn-danger:hover{background:rgba(239,68,68,0.25)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn svg{width:14px;height:14px}

/* ── FORMS ── */
.form-group{margin-bottom:14px}
.form-label{font-size:10px;font-weight:600;color:var(--t3);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.6px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 11px;border:1px solid var(--bg3);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--t1);font-family:var(--font);transition:all 0.15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--p1);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--t3)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.55}
.form-select option{background:var(--bg2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-purple{background:rgba(124,58,237,0.2);color:var(--p3);border:1px solid rgba(124,58,237,0.3)}
.b-cyan{background:rgba(6,182,212,0.15);color:var(--c2);border:1px solid rgba(6,182,212,0.3)}
.b-ok{background:rgba(34,197,94,0.15);color:var(--ok);border:1px solid rgba(34,197,94,0.3)}
.b-warn{background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid rgba(245,158,11,0.3)}
.b-err{background:rgba(239,68,68,0.15);color:var(--err);border:1px solid rgba(239,68,68,0.3)}
.b-gray{background:var(--bg3);color:var(--t2);border:1px solid transparent}

/* ── TABLE ── */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--t3);border-bottom:1px solid var(--bg3);text-transform:uppercase;letter-spacing:0.5px}
.table td{padding:11px 12px;border-bottom:1px solid var(--bg3);vertical-align:middle;color:var(--t2)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:rgba(255,255,255,0.02)}

/* ── GRIDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── STAT CARDS ── */
.stat-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--p1),var(--c1))}
.stat-label{font-size:11px;color:var(--t3);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:0.4px}
.stat-value{font-family:var(--font-h);font-size:32px;font-weight:700;color:var(--t1);line-height:1}

/* ── CLIENT CARDS ── */
.client-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:all 0.18s}
.client-card:hover{border-color:var(--p1);box-shadow:var(--glow-p);transform:translateY(-1px)}
.client-icon{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(6,182,212,0.15));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--bg3)}
.client-name{font-size:13px;font-weight:600;color:var(--t1)}
.client-niche{font-size:11px;color:var(--t3);margin-top:2px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-xl);padding:26px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.5)}
.modal-title{font-family:var(--font-h);font-size:17px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;color:var(--t1)}
.modal-close{background:none;border:none;cursor:pointer;color:var(--t3);font-size:22px;line-height:1;padding:0;font-family:var(--font)}
.modal-close:hover{color:var(--t1)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--bg3);margin-bottom:18px}
.tab{padding:9px 15px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--t3);transition:all 0.15s;font-weight:500}
.tab:hover{color:var(--t1)}
.tab.active{color:var(--p3);border-bottom-color:var(--p1)}

/* ── KANBAN ── */
.kanban-wrap{overflow-x:auto;padding-bottom:8px}
.kanban{display:flex;gap:10px;min-width:max-content}
.kanban-col{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-lg);padding:10px;width:185px;flex-shrink:0}
.kanban-col-title{font-size:10px;font-weight:600;color:var(--t3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.6px}
.kanban-card{background:var(--bg);border:1px solid var(--bg3);border-radius:var(--r);padding:10px;margin-bottom:7px;cursor:pointer;transition:all 0.15s}
.kanban-card:hover{border-color:var(--p1);box-shadow:var(--glow-p)}
.kanban-card-title{font-size:12px;font-weight:500;margin-bottom:4px;line-height:1.4;color:var(--t1)}
.kanban-card-sub{color:var(--t3);font-size:11px}

/* ── PAUTA CARDS ── */
.pauta-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-lg);padding:20px;margin-bottom:12px;transition:border-color 0.15s}
.pauta-card:hover{border-color:var(--bg3)}
.pauta-week{font-size:10px;color:var(--c2);font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
.pauta-title{font-family:var(--font-h);font-size:16px;font-weight:700;margin-bottom:8px;color:var(--t1)}
.pauta-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pauta-body{font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:12px}
.cta-block{background:rgba(124,58,237,0.1);border-left:3px solid var(--p1);padding:9px 13px;border-radius:0 6px 6px 0;font-size:13px;margin-bottom:10px;color:var(--t1)}
.cta-block strong{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--p3);display:block;margin-bottom:3px;font-weight:700}
.seasonal-tag{font-size:12px;color:var(--c2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:5px}

/* ── ALERTS ── */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px;line-height:1.55}
.alert-info{background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.3);color:var(--p3)}
.alert-success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--ok)}
.alert-warning{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--warn)}
.alert-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--err)}

/* ── LOADING ── */
.spinner{width:16px;height:16px;border:2px solid var(--bg3);border-top-color:var(--p1);border-radius:50%;animation:spin 0.75s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--c1));border-radius:2px;transition:width 0.5s ease}
.loading-msg{display:flex;align-items:center;gap:10px;padding:20px;justify-content:center;color:var(--t3);font-size:13px}

/* ── EXPORT ── */
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.export-card{border:1px solid var(--bg3);border-radius:var(--r-lg);padding:20px;text-align:center;cursor:pointer;transition:all 0.18s;background:var(--bg)}
.export-card:hover{border-color:var(--p1);box-shadow:var(--glow-p);transform:translateY(-2px)}
.export-icon{font-size:28px;margin-bottom:8px}
.export-label{font-size:13px;font-weight:600;color:var(--t1)}
.export-sub{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.45}

/* ── MISC ── */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r);padding:8px 11px;transition:border-color 0.15s}
.search-bar:focus-within{border-color:var(--p1)}
.search-bar input{border:none;background:none;flex:1;font-size:13px;color:var(--t1);outline:none;font-family:var(--font)}
.search-bar input::placeholder{color:var(--t3)}
.chip{display:inline-flex;background:var(--bg3);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--t2)}
.divider{border:none;border-top:1px solid var(--bg3);margin:14px 0}
.empty-state{text-align:center;padding:48px 24px;color:var(--t3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.6}
.empty-title{font-family:var(--font-h);font-size:15px;font-weight:700;color:var(--t2);margin-bottom:5px}
.empty-sub{font-size:13px}
.text-sm{font-size:12px;color:var(--t3)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── OVERVIEW CARD ── */
.overview-card{background:rgba(124,58,237,0.07);border:1px solid rgba(124,58,237,0.25);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.overview-label{font-size:10px;font-weight:700;color:var(--p3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.6px}
.overview-text{font-size:13px;color:var(--t2);line-height:1.7}

/* ── COMMENT ── */
.comment-item{background:var(--bg);border-radius:var(--r);padding:10px 12px;margin-bottom:7px;border:1px solid var(--bg3)}
.comment-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-bottom:4px}
.comment-meta strong{color:var(--p3);font-weight:600}
.comment-text{font-size:13px;line-height:1.5;color:var(--t2)}

/* ── FULL SCREENS ── */
.full-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);position:relative;overflow:hidden}
.full-screen::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.08) 0%,transparent 70%);top:-200px;left:-200px;pointer-events:none}
.full-screen::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.06) 0%,transparent 70%);bottom:-100px;right:-100px;pointer-events:none}
.screen-box{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r-xl);padding:40px;width:420px;max-width:100%;position:relative;z-index:1;box-shadow:0 24px 80px rgba(0,0,0,0.5)}
.screen-logo{text-align:center;margin-bottom:28px}
.screen-logo-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--c1));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--glow-p);font-family:var(--font-h);font-size:20px;font-weight:700;color:#fff}
.screen-logo h1{font-family:var(--font-h);font-size:24px;font-weight:700;color:var(--t1)}
.screen-logo h1 span{color:var(--c2)}
.screen-logo p{font-size:12px;color:var(--t3);margin-top:4px}
.setup-steps{background:var(--bg);border-radius:var(--r);padding:14px;margin-bottom:18px;border:1px solid var(--bg3)}
.setup-step{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px;font-size:12px;line-height:1.55;color:var(--t2)}
.setup-step:last-child{margin-bottom:0}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--p1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px;box-shadow:var(--glow-p)}
.setup-step a{color:var(--c2);text-decoration:none;font-weight:500}
.setup-step a:hover{color:var(--c3)}
code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--p3)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const ADMIN={id:'admin',name:'Administrador',email:'admin@agendasearch.com',password:'admin123',role:'admin'};
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STATUS_LIST=['A fazer','Em produção','Em aprovação','Aprovado','Publicado'];
const STATUS_COLORS={'A fazer':'b-gray','Em produção':'b-cyan','Em aprovação':'b-warn','Aprovado':'b-ok','Publicado':'b-purple'};
const NICHES={'Odontologia':'🦷','Medicina':'🏥','Advocacia':'⚖️','Arquitetura':'🏛️','Tecnologia':'💻','Beleza':'💄','Fitness':'💪','Gastronomia':'🍽️','Imóveis':'🏠','Educação':'📚','Moda':'👗','Financeiro':'💰','Pet':'🐾','Turismo':'✈️','Outro':'🏢'};
const PFX='as_';
function lg(k){try{const v=localStorage.getItem(PFX+k);return v?JSON.parse(v):null;}catch{return null;}}
function ls(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}}

const SVG={
  home:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  users:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  client:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>,
  gen:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,

/* ── DOCX EXPORT ── */
async function exportDOCX(client,result,monthName,year,userName){
  try{
    const{Document,Packer,Paragraph,TextRun,BorderStyle,AlignmentType,ShadingType}=window.docx;
    const children=[];
    children.push(
      new Paragraph({children:[new TextRun({text:'AgendaSearch',font:'Arial',size:36,bold:true,color:'7C3AED'})],spacing:{after:60}}),
      new Paragraph({children:[new TextRun({text:'Planejamento de Conteúdo',font:'Arial',size:20,color:'06B6D4'})],spacing:{after:160}}),
      new Paragraph({border:{bottom:{style:BorderStyle.SINGLE,size:6,color:'1F2937',space:1}},children:[new TextRun({text:`${client.name}  ·  ${monthName} de ${year}`,font:'Arial',size:28,bold:true,color:'0B1220'})],spacing:{after:240}}),
      new Paragraph({children:[new TextRun({text:'Cliente: ',font:'Arial',size:22,bold:true,color:'7C3AED'}),new TextRun({text:client.name,font:'Arial',size:22}),new TextRun({text:'   Nicho: ',font:'Arial',size:22,bold:true,color:'7C3AED'}),new TextRun({text:client.niche,font:'Arial',size:22})],spacing:{after:80}}),
      new Paragraph({children:[new TextRun({text:'Período: ',font:'Arial',size:22,bold:true,color:'7C3AED'}),new TextRun({text:`${monthName} ${year}`,font:'Arial',size:22}),new TextRun({text:'   Operador: ',font:'Arial',size:22,bold:true,color:'7C3AED'}),new TextRun({text:userName,font:'Arial',size:22})],spacing:{after:80}}),
      new Paragraph({children:[new TextRun({text:`Gerado em: ${new Date().toLocaleDateString('pt-BR')}`,font:'Arial',size:20,color:'6B7280'})],spacing:{after:320}}),
      new Paragraph({border:{bottom:{style:BorderStyle.SINGLE,size:6,color:'7C3AED',space:1}},children:[new TextRun({text:'Análise Estratégica do Mês',font:'Arial',size:26,bold:true,color:'0B1220'})],spacing:{after:160}}),
      new Paragraph({children:[new TextRun({text:result.overview,font:'Arial',size:22,color:'111827'})],spacing:{after:320}})
    );
    result.pautas.forEach(p=>{
      children.push(
        new Paragraph({border:{bottom:{style:BorderStyle.SINGLE,size:4,color:'06B6D4',space:1}},children:[new TextRun({text:`SEMANA ${p.week}  `,font:'Arial',size:14,bold:true,color:'06B6D4',allCaps:true}),new TextRun({text:p.weekLabel,font:'Arial',size:14,color:'6B7280',allCaps:true})],spacing:{before:280,after:100}}),
        new Paragraph({children:[new TextRun({text:p.title,font:'Arial',size:28,bold:true,color:'0B1220'})],spacing:{after:100}})
      );
      if(p.seasonalDate)children.push(new Paragraph({children:[new TextRun({text:`📅  ${p.seasonalDate}`,font:'Arial',size:20,bold:true,color:'06B6D4'})],spacing:{after:80}}));
      children.push(
        new Paragraph({children:[new TextRun({text:'Formato: ',font:'Arial',size:20,bold:true,color:'7C3AED'}),new TextRun({text:p.format,font:'Arial',size:20}),new TextRun({text:'   Objetivo: ',font:'Arial',size:20,bold:true,color:'7C3AED'}),new TextRun({text:p.objective,font:'Arial',size:20}),new TextRun({text:'   Tema: ',font:'Arial',size:20,bold:true,color:'7C3AED'}),new TextRun({text:p.theme,font:'Arial',size:20})],spacing:{after:140}}),
        new Paragraph({children:[new TextRun({text:'Descrição',font:'Arial',size:20,bold:true,color:'7C3AED'})],spacing:{after:60}}),
        new Paragraph({children:[new TextRun({text:p.description,font:'Arial',size:22,color:'111827'})],spacing:{after:140}}),
        new Paragraph({children:[new TextRun({text:'Call to Action:  ',font:'Arial',size:20,bold:true,color:'7C3AED'}),new TextRun({text:p.cta,font:'Arial',size:22,bold:true,color:'0B1220'})],spacing:{after:100}})
      );
      if(p.hashtags)children.push(new Paragraph({children:[new TextRun({text:p.hashtags,font:'Arial',size:18,color:'6B7280'})],spacing:{after:60}}));
    });
    children.push(new Paragraph({border:{top:{style:BorderStyle.SINGLE,size:4,color:'1F2937',space:1}},children:[new TextRun({text:`AgendaSearch  ·  ${new Date().toLocaleDateString('pt-BR')}  ·  ${userName}`,font:'Arial',size:18,color:'6B7280'})],spacing:{before:320},alignment:AlignmentType.CENTER}));
    const doc=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1440,right:1440,bottom:1440,left:1440}}},children}]});
    const buffer=await Packer.toBuffer(doc);
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=`AgendaSearch_${client.name.replace(/\s/g,'_')}_${monthName}_${year}.docx`;
    a.click();URL.revokeObjectURL(url);return true;
  }catch(e){console.error(e);return false;}
}

/* ══ LOGIN ══ */
function LoginScreen({onLogin}){
  const[email,setEmail]=useState('');const[pass,setPass]=useState('');const[err,setErr]=useState('');
  function doLogin(){
    if(!email||!pass){setErr('Preencha e-mail e senha.');return;}
    if(email===ADMIN.email&&pass===ADMIN.password){onLogin(ADMIN);return;}
    const users=lg('users')||[];
    const u=users.find(u=>u.email===email&&u.password===pass);
    if(u)onLogin(u);else setErr('E-mail ou senha incorretos.');
  }
  return(
    <div className="full-screen">
      <div className="screen-box">
        <div className="screen-logo">
          <div className="screen-logo-icon">AS</div>
          <h1>Agenda<span>Search</span></h1>
          <p>Plataforma de pautas inteligentes com IA</p>
        </div>
        {err&&<div className="alert alert-error">{err}</div>}
        <div className="form-group"><label className="form-label">E-mail</label><input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@agendasearch.com" onKeyDown={e=>e.key==='Enter'&&doLogin()} autoFocus/></div>
        <div className="form-group"><label className="form-label">Senha</label><input className="form-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&doLogin()}/></div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'10px'}} onClick={doLogin}><Ico n="check"/>Entrar na plataforma</button>
        <p className="text-sm" style={{textAlign:'center',marginTop:14,lineHeight:1.7}}>Acesso padrão:<br/><code>admin@agendasearch.com</code> / <code>admin123</code></p>

    </div>
  );
}

/* ══ GENERATOR ══ */
function GeneratorPanel({user,clients,pautas,setPautas,apiKey}){
  const mine=user.role==='admin'?clients:clients.filter(c=>c.assignedTo===user.id);
  const now=new Date();
  const[clientId,setClientId]=useState(mine[0]?.id||'');
  const[month,setMonth]=useState(now.getMonth());
  const[year,setYear]=useState(now.getFullYear());
  const[loading,setLoading]=useState(false);
  const[lMsg,setLMsg]=useState('');
  const[progress,setProgress]=useState(0);
  const[result,setResult]=useState(null);
  const[error,setError]=useState('');
  const[saved,setSaved]=useState(false);
  const[showExp,setShowExp]=useState(false);
  const[expDocx,setExpDocx]=useState(false);
  const client=mine.find(c=>c.id===clientId);
  const history=pautas.filter(p=>p.clientId===clientId).map(p=>`${MONTHS[p.month]} ${p.year} Sem${p.week}: "${p.title}"`).join('\n');
  const LMSGS=[`Consultando calendário de ${MONTHS[month]} ${year}...`,'Analisando o cérebro do cliente...','Identificando datas sazonais...','Criando pautas estratégicas...','Revisando gramática...','Overview final de qualidade...','Finalizando...'];

  async function generate(){
    if(!client){setError('Selecione um cliente.');return;}
    if(apiKey==='demo'){
      setLoading(true);setError('');setResult(null);setSaved(false);setProgress(5);setShowExp(false);
      let mi=0;setLMsg(LMSGS[0]);
      const iv=setInterval(()=>{mi=(mi+1)%LMSGS.length;setLMsg(LMSGS[mi]);setProgress(p=>Math.min(p+13,88));},500);
      await new Promise(r=>setTimeout(r,4000));
      clearInterval(iv);setProgress(100);
      setResult({
        overview:`Análise estratégica para ${client.name} em ${MONTHS[month]} ${year}. Nicho: ${client.niche}. Tom: ${client.tone}. Foram identificadas datas sazonais relevantes e criadas pautas originais equilibrando engajamento, autoridade e conversão.`,
        pautas:[
          {week:1,weekLabel:`Semana 1 — 01 a 07 de ${MONTHS[month]}`,title:'Pauta Sazional — Conexão com o Calendário',seasonalDate:'Data comemorativa identificada via busca real',theme:'Engajamento sazional',format:'Carrossel',objective:'Educação',description:'Com a API Anthropic configurada, a IA consultaria o calendário real do Brasil, filtraria datas relevantes ao nicho '+client.niche+' e criaria pautas ricas com diretrizes detalhadas de copy e criação visual alinhadas ao tom '+client.tone+'.',cta:'Configure sua API key para pautas reais →',hashtags:'#demo #agendasearch #marketing'},
          {week:2,weekLabel:`Semana 2 — 08 a 14 de ${MONTHS[month]}`,title:'Construção de Autoridade no Nicho',seasonalDate:null,theme:'Autoridade e expertise',format:'Reels',objective:'Autoridade',description:'A IA age como Analista de Marketing + Copywriter Sênior + Redator especialista. Verifica o histórico para garantir 100% originalidade e faz overview completo de gramática e estratégia antes de retornar as pautas.',cta:'Explore o app em modo demo →',hashtags:'#autoridade #especialista #conteudo'},
          {week:3,weekLabel:`Semana 3 — 15 a 21 de ${MONTHS[month]}`,title:'Engajamento com Data Comemorativa',seasonalDate:'Dia comemorativo relevante ao nicho',theme:'Conteúdo sazional estratégico',format:'Post',objective:'Engajamento',description:'Cada pauta tem título impactante, descrição densa com diretrizes de copy, abordagem criativa e call to action persuasivo alinhados aos objetivos de marketing do cliente.',cta:'Agende sua demonstração →',hashtags:'#estrategia #conteudo #engajamento'},
          {week:4,weekLabel:`Semana 4 — 22 a 30 de ${MONTHS[month]}`,title:'Fechamento do Mês — Foco em Conversão',seasonalDate:null,theme:'Conversão e resultados',format:'Stories',objective:'Conversão',description:'A última semana foca em conversão. A IA varia formatos ao longo do mês — Post, Reels, Carrossel, Stories — para maximizar alcance em diferentes plataformas e manter o interesse do público.',cta:'Entre em contato agora →',hashtags:'#resultado #conversao #sucesso'},
        ]
      });
      setLoading(false);return;
    }
    setLoading(true);setError('');setResult(null);setSaved(false);setProgress(5);setShowExp(false);
    let mi=0;setLMsg(LMSGS[0]);
    const iv=setInterval(()=>{mi=(mi+1)%LMSGS.length;setLMsg(LMSGS[mi]);setProgress(p=>Math.min(p+10,88));},2800);
    try{
      const sys=`Você é um Analista de Marketing com doutorado em Comunicação, Copywriter Sênior e Redator com doutorado em Letras pela USP. Extremamente analítico e criativo.
REGRAS: 1)Nunca repita pautas do histórico. 2)Português do Brasil impecável. 3)Use web_search para datas comemorativas reais de ${MONTHS[month]} ${year} Brasil. 4)Filtre datas relevantes ao nicho. 5)Varie formatos. 6)Descrições densas mínimo 3 linhas.
Retorne SOMENTE JSON válido sem markdown:
{"overview":"análise 2-3 parágrafos","pautas":[{"week":1,"weekLabel":"Semana 1 — 01 a 07 de ${MONTHS[month]}","title":"...","seasonalDate":null,"theme":"...","format":"Post/Reels/Carrossel/Artigo/Stories","objective":"Engajamento/Conversão/Educação/Autoridade","description":"...","cta":"...","hashtags":"..."}]}`;
      const msg=`Gere 4 pautas para ${MONTHS[month]} ${year}.\nCliente: ${client.name} | Nicho: ${client.niche} | Tom: ${client.tone}\nDescrição: ${client.description||'N/A'}\nPúblico: ${client.audience||'N/A'}\nObjetivos: ${client.objectives||'N/A'}\nHistórico:\n${history||'Primeira geração!'}`;
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,system:sys,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:msg}]})});
      if(!resp.ok){const ed=await resp.json().catch(()=>({}));throw new Error(ed.error?.message||`HTTP ${resp.status}`);}
      const data=await resp.json();
      clearInterval(iv);setProgress(95);
      let txt='';for(const b of(data.content||[])){if(b.type==='text')txt+=b.text;}
      txt=txt.replace(/```json|```/g,'').trim();
      const i1=txt.indexOf('{'),i2=txt.lastIndexOf('}');
      if(i1>=0&&i2>=0)txt=txt.slice(i1,i2+1);
      setResult(JSON.parse(txt));setProgress(100);
    }catch(e){clearInterval(iv);setError('Erro: '+e.message);}
    finally{setLoading(false);}
  }

  function savePautas(){
    if(!result)return;
    const newP=result.pautas.map(p=>({...p,id:'p_'+Date.now()+'_'+p.week,clientId,month,year,status:'A fazer',commentHistory:[],createdAt:new Date().toISOString(),createdBy:user.id}));
    const upd=[...pautas,...newP];ls('pautas',upd);setPautas(upd);setSaved(true);
  }

  function exportPDF(){
    if(!result||!client)return;
    const w=window.open('','_blank');
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pautas ${client.name}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>

          <div className="export-grid">
            <div className="export-card" onClick={exportPDF}><div className="export-icon">📄</div><div className="export-label">PDF Visual</div><div className="export-sub">Design futurista, pronto para apresentar ao cliente</div></div>
            <div className="export-card" onClick={handleDocx} style={{opacity:expDocx?0.6:1}}><div className="export-icon">{expDocx?'⏳':'📝'}</div><div className="export-label">{expDocx?'Gerando...':'Word (.docx)'}</div><div className="export-sub">Abre no Microsoft Word — editável e formatado</div></div>
          </div>
        </div>}
      </>}
    </div>
  );
}

/* ══ KANBAN ══ */
function KanbanPanel({user,clients,pautas,setPautas}){
  const mine=user.role==='admin'?clients:clients.filter(c=>c.assignedTo===user.id);
  const now=new Date();
  const[fC,setFC]=useState('all');
  const[fM,setFM]=useState(now.getMonth());
  const[fY,setFY]=useState(now.getFullYear());
  const[sel,setSel]=useState(null);
  const[comment,setComment]=useState('');
  const filtered=pautas.filter(p=>(fC==='all'||p.clientId===fC)&&p.month===fM&&p.year===fY&&mine.find(c=>c.id===p.clientId));
  function updStatus(id,status){const upd=pautas.map(p=>p.id===id?{...p,status}:p);ls('pautas',upd);setPautas(upd);if(sel?.id===id)setSel(prev=>({...prev,status}));}
  function addComment(id){
    if(!comment.trim())return;
    const nc={text:comment,author:user.name,date:new Date().toLocaleDateString('pt-BR'),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
    const upd=pautas.map(p=>p.id===id?{...p,commentHistory:[...(p.commentHistory||[]),nc]}:p);
    ls('pautas',upd);setPautas(upd);setSel(upd.find(p=>p.id===id));setComment('');
  }
  return(
    <div className="content">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <select className="form-select" style={{width:'auto'}} value={fC} onChange={e=>setFC(e.target.value)}><option value="all">Todos os clientes</option>{mine.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
        <select className="form-select" style={{width:'auto'}} value={fM} onChange={e=>setFM(+e.target.value)}>{MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
        <select className="form-select" style={{width:'auto'}} value={fY} onChange={e=>setFY(+e.target.value)}>{[2025,2026,2027].map(y=><option key={y}>{y}</option>)}</select>
        <span className="text-sm">{filtered.length} pauta(s)</span>
      </div>
      {filtered.length===0?<div className="empty-state"><div className="empty-icon">🗂️</div><div className="empty-title">Nenhuma pauta neste período</div><div className="empty-sub">Gere e salve pautas para gerenciá-las aqui</div></div>:
      <div className="kanban-wrap"><div className="kanban">
        {STATUS_LIST.map(status=>{
          const col=filtered.filter(p=>p.status===status);
          return(<div key={status} className="kanban-col">
            <div className="kanban-col-title">{status} <span style={{opacity:0.5,fontWeight:400}}>({col.length})</span></div>
            {col.map(p=>{const c=mine.find(cl=>cl.id===p.clientId);return(
              <div key={p.id} className="kanban-card" onClick={()=>setSel(p)}>
                <div className="kanban-card-title">{p.title}</div>
                <div className="kanban-card-sub">{c?.name||'—'} · Sem. {p.week}</div>
                <div style={{marginTop:5}}><Bdg t={p.format} c="b-cyan"/></div>
              </div>
            );})}
          </div>);
        })}
      </div></div>}
      {sel&&<div className="modal-overlay" onClick={()=>setSel(null)}><div className="modal" style={{width:540}} onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{sel.title}<button className="modal-close" onClick={()=>setSel(null)}>×</button></div>
        <div className="pauta-week" style={{marginBottom:8}}>{sel.weekLabel}</div>
        <div className="pauta-meta" style={{marginBottom:12}}><Bdg t={sel.format} c="b-cyan"/><Bdg t={sel.objective} c="b-purple"/></div>
        <p style={{fontSize:13,color:'var(--t2)',lineHeight:1.75,marginBottom:14,whiteSpace:'pre-wrap'}}>{sel.description}</p>
        <div className="cta-block" style={{marginBottom:14}}><strong>Call to Action</strong>{sel.cta}</div>
        <div className="form-group"><label className="form-label">Alterar status</label><select className="form-select" value={sel.status} onChange={e=>updStatus(sel.id,e.target.value)}>{STATUS_LIST.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="divider"/>
        <div className="form-label" style={{marginBottom:10}}>Comentários ({(sel.commentHistory||[]).length})</div>
        <div style={{maxHeight:180,overflowY:'auto',marginBottom:12}}>
          {(sel.commentHistory||[]).length===0?<p className="text-sm" style={{marginBottom:8}}>Nenhum comentário ainda.</p>:
          (sel.commentHistory||[]).map((cm,i)=><div key={i} className="comment-item"><div className="comment-meta"><strong>{cm.author}</strong><span>{cm.date} às {cm.time}</span></div><div className="comment-text">{cm.text}</div></div>)}
        </div>
        <div style={{display:'flex',gap:8}}>
          <input className="form-input" style={{flex:1}} value={comment} onChange={e=>setComment(e.target.value)} placeholder="Adicionar comentário..." onKeyDown={e=>e.key==='Enter'&&addComment(sel.id)}/>
          <button className="btn btn-primary btn-sm" onClick={()=>addComment(sel.id)}>Enviar</button>
        </div>
      </div></div>}
    </div>
  );
}

/* ══ APP ROOT ══ */
function App(){
  const[apiKey,setApiKey]=useState(()=>lg('apikey')||'');
  const[user,setUser]=useState(null);
  const[page,setPage]=useState('dashboard');
  const[clients,setClients]=useState(()=>lg('clients')||[]);
  const[pautas,setPautas]=useState(()=>lg('pautas')||[]);
  const[selClient,setSelClient]=useState(null);
  useEffect(()=>{ls('clients',clients);},[clients]);
  useEffect(()=>{ls('pautas',pautas);},[pautas]);
  if(!apiKey)return <ApiSetup onSave={k=>setApiKey(k)}/>;
  if(!user)return <LoginScreen onLogin={setUser}/>;
  const mine=user.role==='admin'?clients:clients.filter(c=>c.assignedTo===user.id);
  const PI={dashboard:['Dashboard','Visão geral da plataforma'],clients:['Clientes','Cérebro de cada cliente'],generator:['Gerar Pauta','IA para pautas mensais'],kanban:['Gestão de Pautas','Status e comentários'],users:['Usuários','Operadores do sistema'],'client-detail':[selClient?.name||'',selClient?.niche||'']};
  const[title,subtitle]=PI[page]||['AgendaSearch',''];
  function nav(p){setPage(p);setSelClient(null);}
  return(
    <div className="app">
      <div className="sidebar">
        <div className="sb-logo">
          <div className="sb-logo-icon">AS</div>
          <div className="sb-logo-text"><h1>Agenda<span>Search</span></h1><p>Pautas inteligentes</p></div>
        </div>
        <div className="sb-nav">
          <div className="sb-sec">Principal</div>
          {[{id:'dashboard',icon:'home',label:'Dashboard'},{id:'clients',icon:'client',label:'Clientes'},{id:'generator',icon:'gen',label:'Gerar Pauta'},{id:'kanban',icon:'kanban',label:'Gestão de Pautas'}].map(n=>(
            <div key={n.id} className={`sb-item ${(page===n.id||(page==='client-detail'&&n.id==='clients'))?'active':''}`} onClick={()=>nav(n.id)}>
              <span style={{display:'flex',width:15,height:15}}>{SVG[n.icon]}</span>{n.label}
            </div>
          ))}
          {user.role==='admin'&&<>
            <div className="sb-sec" style={{marginTop:12}}>Administração</div>
            <div className={`sb-item ${page==='users'?'active':''}`} onClick={()=>nav('users')}><span style={{display:'flex',width:15,height:15}}>{SVG.users}</span>Usuários</div>
          </>}
          <div className="sb-sec" style={{marginTop:12}}>Sistema</div>
          <div className="sb-item" onClick={()=>{if(window.confirm('Trocar chave de API?')){ls('apikey','');setApiKey('');setUser(null);}}}><span style={{display:'flex',width:15,height:15}}>{SVG.key}</span>API Key</div>
        </div>
        <div className="sb-user">
          <div className="sb-urow"><div className="av">{user.name[0]}</div><div><div className="sb-uname">{user.name}</div><div className="sb-urole">{user.role==='admin'?'Administrador':'Operador'}</div></div></div>
          <button className="sb-logout" onClick={()=>{setUser(null);setPage('dashboard');}}>Sair da conta</button>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div><h2>{title}</h2>{subtitle&&<p>{subtitle}</p>}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="text-sm">{mine.length} cliente(s)</span>
            <Bdg t={`${pautas.filter(p=>mine.find(c=>c.id===p.clientId)).length} pautas`} c="b-gray"/>
            {apiKey==='demo'&&<Bdg t="Demo" c="b-warn"/>}
          </div>
        </div>
        {page==='dashboard'&&<Dashboard user={user} clients={clients} pautas={pautas}/>}
        {page==='clients'&&<ClientsPanel user={user} clients={clients} setClients={setClients} onSelect={c=>{setSelClient(c);setPage('client-detail');}}/>}
        {page==='client-detail'&&selClient&&<ClientDetail client={selClient} clients={clients} setClients={setClients} pautas={pautas} onBack={()=>setPage('clients')}/>}
        {page==='generator'&&<GeneratorPanel user={user} clients={clients} pautas={pautas} setPautas={setPautas} apiKey={apiKey}/>}
        {page==='kanban'&&<KanbanPanel user={user} clients={clients} pautas={pautas} setPautas={setPautas}/>}
        {page==='users'&&user.role==='admin'&&<UsersPanel/>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
