<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgendaSearch — Pautas Inteligentes</title>
  <meta name="description" content="Plataforma de geração de pautas mensais com IA para agências de marketing" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --border-md: #cbd5e1;
      --accent: #F97316;
      --accent-hover: #ea6c0f;
      --accent-light: #fff7ed;
      --sidebar: #0F172A;
      --radius: 8px;
      --radius-lg: 10px;
    }
    html, body, #root { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-tertiary); color: var(--text-primary); font-size: 14px; }
    * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    *::-webkit-scrollbar { width: 5px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 224px; background: var(--sidebar); flex-shrink: 0; display: flex; flex-direction: column; }
    .main { flex: 1; overflow-y: auto; background: var(--bg-tertiary); }

    .sidebar-logo { padding: 22px 16px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
    .sidebar-logo h1 { color: #fff; font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
    .sidebar-logo h1 span { color: var(--accent); }
    .sidebar-logo p { color: rgba(255,255,255,0.38); font-size: 11px; margin-top: 3px; }
    .sidebar-nav { flex: 1; padding: 14px 8px; overflow-y: auto; }
    .nav-section-title { color: rgba(255,255,255,0.28); font-size: 10px; letter-spacing: 1.2px; padding: 0 8px; margin: 10px 0 4px; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 7px; cursor: pointer; color: rgba(255,255,255,0.58); font-size: 13px; transition: all 0.15s; user-select: none; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
    .sidebar-user { padding: 12px; border-top: 0.5px solid rgba(255,255,255,0.1); }
    .sidebar-user-row { display: flex; align-items: center; gap: 9px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .avatar.sm { width: 26px; height: 26px; font-size: 11px; }
    .user-name { color: #fff; font-size: 12px; font-weight: 600; }
    .user-role { color: rgba(255,255,255,0.4); font-size: 10px; }
    .logout-btn { margin-top: 8px; width: 100%; padding: 7px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(255,255,255,0.5); font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .logout-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .topbar { background: var(--bg-primary); border-bottom: 0.5px solid var(--border); padding: 13px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .topbar h2 { font-size: 15px; font-weight: 700; }
    .topbar p { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

    .content { padding: 24px; }

    .card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
    .card + .card { margin-top: 16px; }
    .card-title { font-size: 13px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary); }

    .btn { padding: 7px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; font-family: inherit; border: none; font-weight: 500; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-secondary); border: 0.5px solid var(--border-md); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--bg-tertiary); }
    .btn-danger { background: #fee2e2; border: 0.5px solid #fca5a5; color: #991b1b; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn svg { width: 14px; height: 14px; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 8px 10px; border: 0.5px solid var(--border-md); border-radius: 7px; font-size: 13px; background: var(--bg-primary); color: var(--text-primary); font-family: inherit; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
    .form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-orange { background: #ffedd5; color: #9a3412; }
    .badge-gray { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border); }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }
    .badge-red { background: #fee2e2; color: #991b1b; }

    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700; color: var(--text-secondary); border-bottom: 0.5px solid var(--border); background: var(--bg-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .table td { padding: 11px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: var(--bg-secondary); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    .stat-card { background: var(--bg-secondary); border-radius: var(--radius); padding: 16px; }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .stat-value { font-size: 30px; font-weight: 700; line-height: 1; }

    .client-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; transition: all 0.15s; }
    .client-card:hover { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(249,115,22,0.12); }
    .client-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .client-icon { width: 40px; height: 40px; border-radius: 9px; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .client-name { font-size: 14px; font-weight: 700; }
    .client-niche { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { background: var(--bg-primary); border-radius: 13px; padding: 26px; width: 520px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 22px; line-height: 1; padding: 0; font-family: inherit; }
    .modal-close:hover { color: var(--text-primary); }

    .tabs { display: flex; border-bottom: 0.5px solid var(--border); margin-bottom: 20px; }
    .tab { padding: 9px 15px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-secondary); transition: all 0.15s; font-weight: 600; }
    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .kanban-wrap { overflow-x: auto; padding-bottom: 8px; }
    .kanban { display: flex; gap: 10px; min-width: max-content; }
    .kanban-col { background: var(--bg-secondary); border-radius: var(--radius); padding: 10px; width: 185px; flex-shrink: 0; }
    .kanban-col-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px; }
    .kanban-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: 7px; padding: 10px; margin-bottom: 7px; cursor: pointer; font-size: 12px; transition: border-color 0.15s; }
    .kanban-card:hover { border-color: var(--accent); }
    .kanban-card-title { font-weight: 700; margin-bottom: 4px; line-height: 1.4; }
    .kanban-card-sub { color: var(--text-secondary); font-size: 11px; }

    .pauta-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 12px; }
    .pauta-week { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    .pauta-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .pauta-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pauta-body { font-size: 13px; color: var(--text-secondary); line-height: 1.75; margin-bottom: 12px; }

    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar { height: 4px; background: var(--bg-secondary); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s ease; }
    .loading-msg { display: flex; align-items: center; gap: 10px; padding: 24px; justify-content: center; color: var(--text-secondary); font-size: 13px; }

    .alert { padding: 11px 14px; border-radius: 7px; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
    .alert-info { background: #eff6ff; border: 0.5px solid #bfdbfe; color: #1e40af; }
    .alert-success { background: #f0fdf4; border: 0.5px solid #bbf7d0; color: #166534; }
    .alert-warning { background: #fffbeb; border: 0.5px solid #fde68a; color: #92400e; }
    .alert-error { background: #fef2f2; border: 0.5px solid #fecaca; color: #991b1b; }

    .export-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .export-card { border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; cursor: pointer; transition: all 0.15s; }
    .export-card:hover { border-color: var(--accent); background: var(--accent-light); }
    .export-icon { font-size: 28px; margin-bottom: 7px; }
    .export-label { font-size: 12px; font-weight: 700; }
    .export-sub { font-size: 11px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }

    .search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-secondary); border: 0.5px solid var(--border); border-radius: 7px; padding: 7px 11px; }
    .search-bar input { border: none; background: none; flex: 1; font-size: 13px; color: var(--text-primary); outline: none; font-family: inherit; }

    .chip { display: inline-flex; align-items: center; background: var(--bg-secondary); border: 0.5px solid var(--border); border-radius: 20px; padding: 3px 9px; font-size: 11px; color: var(--text-secondary); }
    .divider { border: none; border-top: 0.5px solid var(--border); margin: 16px 0; }

    .empty-state { text-align: center; padding: 52px 24px; color: var(--text-secondary); }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }
    .empty-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
    .empty-sub { font-size: 13px; }

    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap8 { gap: 8px; }
    .gap12 { gap: 12px; }
    .mb16 { margin-bottom: 16px; }
    .text-sm { font-size: 12px; color: var(--text-secondary); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* API Key Setup Screen */
    .setup-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0F172A; padding: 16px; }
    .setup-box { background: var(--bg-primary); border-radius: 16px; padding: 40px; width: 480px; max-width: 100%; }
    .setup-logo { text-align: center; margin-bottom: 28px; }
    .setup-logo h1 { font-size: 28px; font-weight: 800; }
    .setup-logo h1 span { color: var(--accent); }
    .setup-logo p { font-size: 13px; color: var(--text-secondary); margin-top: 5px; }
    .setup-steps { background: var(--bg-secondary); border-radius: 9px; padding: 16px; margin-bottom: 20px; }
    .setup-step { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
    .setup-step:last-child { margin-bottom: 0; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
    .setup-step a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .setup-step a:hover { text-decoration: underline; }

    /* Login Screen */
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0F172A; padding: 16px; }
    .login-box { background: var(--bg-primary); border-radius: 14px; padding: 40px; width: 390px; max-width: 100%; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo h1 { font-size: 26px; font-weight: 800; }
    .login-logo h1 span { color: var(--accent); }
    .login-logo p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    .overview-card { background: var(--accent-light); border: 0.5px solid #fed7aa; border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; }
    .overview-label { font-size: 11px; font-weight: 700; color: #9a3412; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
    .overview-text { font-size: 13px; color: #7c2d12; line-height: 1.7; }

    .cta-block { background: var(--bg-secondary); border-left: 3px solid var(--accent); padding: 9px 13px; border-radius: 0 5px 5px 0; font-size: 13px; margin-bottom: 10px; }
    .cta-block strong { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); display: block; margin-bottom: 3px; font-weight: 700; }
    .seasonal-tag { font-size: 12px; color: #059669; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

    .comment-item { background: var(--bg-secondary); border-radius: 7px; padding: 10px 12px; margin-bottom: 8px; }
    .comment-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
    .comment-meta strong { color: var(--text-primary); font-weight: 700; }
    .comment-text { font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── Constants ─── */
const APP_VERSION = '1.0.0';
const STORAGE_PREFIX = 'agendasearch_';
const ADMIN_DEFAULT = { id:'admin', name:'Administrador', email:'admin@agendasearch.com', password:'admin123', role:'admin' };
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STATUS_LIST = ['A fazer','Em produção','Em aprovação','Aprovado','Publicado'];
const STATUS_COLORS = { 'A fazer':'badge-gray','Em produção':'badge-blue','Em aprovação':'badge-orange','Aprovado':'badge-green','Publicado':'badge-purple' };
const NICHE_ICONS = { 'Odontologia':'🦷','Medicina':'🏥','Advocacia':'⚖️','Arquitetura':'🏛️','Tecnologia':'💻','Beleza':'💄','Fitness':'💪','Gastronomia':'🍽️','Imóveis':'🏠','Educação':'📚','Moda':'👗','Financeiro':'💰','Pet':'🐾','Turismo':'✈️','Outro':'🏢' };

/* ─── LocalStorage helpers ─── */
function lsGet(key) {
  try { const v = localStorage.getItem(STORAGE_PREFIX+key); return v ? JSON.parse(v) : null; } catch { return null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(val)); return true; } catch(e) { console.error('Storage error:', e); return false; }
}

/* ─── Icons ─── */
const I = {
  home:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  users:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  client:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>,
  gen:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
  kanban:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
  plus:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  download:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
  trash:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>,
  edit:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  search:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  save:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
  check:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
  refresh:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>,
  key:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
  eye:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  eyeoff:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
};

function Ico({ n, size=15 }) {
  return <span style={{display:'inline-flex',alignItems:'center',width:size,height:size,flexShrink:0}}>{I[n]}</span>;
}
function Badge({ text, type='badge-gray' }) {
  return <span className={`badge ${type}`}>{text}</span>;
}

   API KEY SETUP SCREEN
══════════════════════════════════════ */
function ApiKeySetup({ onSave }) {
  const [key, setKey] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  const [testing, setTesting] = useState(false);

  async function testAndSave() {
    if (!key.trim().startsWith('sk-ant-')) {
      setErr('Chave inválida. A chave Anthropic começa com "sk-ant-".');
      return;
    }
    setTesting(true); setErr('');
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-haiku-4-5-20251001',
          max_tokens:10,
          messages:[{role:'user',content:'ping'}]
        })
      });
      // Se chegou aqui sem CORS fatal, salvamos
      lsSet('apikey', key.trim());
      onSave(key.trim());
    } catch(e) {
      // CORS em localhost é esperado — salvamos mesmo assim
      lsSet('apikey', key.trim());
      onSave(key.trim());
    } finally { setTesting(false); }
  }

  return (
    <div className="setup-screen">
      <div className="setup-box">
        <div className="setup-logo">
          <h1>Agenda<span>Search</span></h1>
          <p>Configure sua chave de API para começar</p>
        </div>
        <div className="setup-steps">
          <div className="setup-step">
            <div className="step-num">1</div>
            <div>Acesse <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> e faça login ou crie sua conta gratuita.</div>
          </div>
          <div className="setup-step">
            <div className="step-num">2</div>
            <div>No menu lateral, clique em <strong>"API Keys"</strong> → <strong>"Create Key"</strong>. Dê um nome como <em>AgendaSearch</em>.</div>
          </div>
          <div className="setup-step">
            <div className="step-num">3</div>
            <div>Copie a chave gerada (começa com <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:4,fontSize:12}}>sk-ant-api...</code>) e cole abaixo.</div>
          </div>
          <div className="setup-step">
            <div className="step-num">4</div>
            <div>Certifique-se de ter créditos em <a href="https://console.anthropic.com/settings/billing" target="_blank">console.anthropic.com/settings/billing</a>. O plano gratuito inclui créditos iniciais.</div>
          </div>
        </div>
        {err && <div className="alert alert-error">{err}</div>}
        <div className="form-group">
          <label className="form-label">Sua chave de API Anthropic</label>
          <div style={{display:'flex',gap:8}}>
            <input
              className="form-input"
              type={show?'text':'password'}
              value={key}
              onChange={e=>setKey(e.target.value)}
              placeholder="sk-ant-api03-..."
              onKeyDown={e=>e.key==='Enter'&&testAndSave()}
              style={{flex:1}}
            />
            <button className="btn btn-secondary btn-sm" onClick={()=>setShow(!show)} style={{flexShrink:0}}>
              <Ico n={show?'eyeoff':'eye'}/>
            </button>
          </div>
        </div>
        <div className="alert alert-info" style={{marginBottom:16}}>
          🔒 Sua chave é salva apenas no seu navegador (localStorage) e nunca é enviada para nenhum servidor externo, exceto diretamente para a API da Anthropic.
        </div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={testAndSave} disabled={testing||!key.trim()}>
          {testing ? <span className="spinner" style={{width:14,height:14}}/> : <Ico n="key"/>}
          {testing ? 'Verificando...' : 'Salvar e continuar'}
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════ */
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function doLogin() {
    if (!email||!pass) { setErr('Preencha e-mail e senha.'); return; }
    setLoading(true); setErr('');
    await new Promise(r=>setTimeout(r,350));
    if (email===ADMIN_DEFAULT.email && pass===ADMIN_DEFAULT.password) { onLogin(ADMIN_DEFAULT); return; }
    const users = lsGet('users') || [];
    const u = users.find(u=>u.email===email&&u.password===pass);
    if (u) { onLogin(u); }
    else { setErr('E-mail ou senha incorretos. Tente novamente.'); setLoading(false); }
  }

  return (
    <div className="login-screen">
      <div className="login-box">
        <div className="login-logo">
          <h1>Agenda<span>Search</span></h1>
          <p>Plataforma de pautas inteligentes com IA</p>
        </div>
        {err && <div className="alert alert-error">{err}</div>}
        <div className="form-group">
          <label className="form-label">E-mail</label>
          <input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" onKeyDown={e=>e.key==='Enter'&&doLogin()} autoFocus />
        </div>
        <div className="form-group">
          <label className="form-label">Senha</label>
          <input className="form-input" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&doLogin()} />
        </div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'10px'}} onClick={doLogin} disabled={loading}>
          {loading ? <span className="spinner" style={{width:14,height:14}}/> : <Ico n="check"/>}
          {loading ? 'Entrando...' : 'Entrar na plataforma'}
        </button>
        <p className="text-sm" style={{textAlign:'center',marginTop:16,lineHeight:1.5}}>
          Acesso padrão:<br/>
          <code style={{background:'#f1f5f9',padding:'2px 6px',borderRadius:4}}>admin@agendasearch.com</code> / <code style={{background:'#f1f5f9',padding:'2px 6px',borderRadius:4}}>admin123</code>
        </p>
      </div>
    </div>
  );
}

      )}

}

function GeneratorPanel({ user, clients, pautas, setPautas, apiKey }) {
  const mine = user.role==='admin' ? clients : clients.filter(c=>c.assignedTo===user.id);
  const now = new Date();
  const [clientId, setClientId] = useState(mine[0]?.id||'');
  const [month, setMonth] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const [loading, setLoading] = useState(false);
  const [lMsg, setLMsg] = useState('');
  const [progress, setProgress] = useState(0);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [saved, setSaved] = useState(false);
  const [showExport, setShowExport] = useState(false);

  const client = mine.find(c=>c.id===clientId);
  const history = pautas.filter(p=>p.clientId===clientId)
    .map(p=>`${MONTHS[p.month]} ${p.year} — Sem.${p.week}: "${p.title}" tema:(${p.theme||''})`).join('\n');

  const LMSGS = [
    `Consultando calendário de ${MONTHS[month]} ${year}...`,
    'Lendo o cérebro do cliente...',
    'Identificando datas sazonais relevantes...',
    'Criando pautas estratégicas e originais...',
    'Revisando gramática e ortografia...',
    'Realizando overview final de qualidade...',
    'Estruturando e finalizando as pautas...',
  ];

  async function generate() {
    if (!client) { setError('Selecione um cliente válido.'); return; }
    if (!apiKey) { setError('Chave de API não configurada. Recarregue a página.'); return; }
    setLoading(true); setError(''); setResult(null); setSaved(false); setProgress(5); setShowExport(false);
    let mi=0; setLMsg(LMSGS[0]);
    const iv = setInterval(()=>{ mi=(mi+1)%LMSGS.length; setLMsg(LMSGS[mi]); setProgress(p=>Math.min(p+10,88)); },2800);

    try {
      const sys = `Você é um Analista de Marketing com doutorado em Comunicação, Copywriter Sênior com mais de 20 anos de experiência e Redator com doutorado em Letras pela USP. É extremamente analítico, estratégico e criativo. Seu papel é criar pautas mensais de conteúdo para redes sociais e marketing digital, personalizadas para cada cliente.

REGRAS ABSOLUTAS:
1. JAMAIS repita tema, abordagem ou pauta já utilizada — consulte cuidadosamente o histórico.
2. Use português do Brasil impecável — zero erros gramaticais, ortográficos ou de concordância.
3. Antes de responder, faça um overview interno: gramática, relevância estratégica, originalidade e alinhamento com o cliente.
4. Use web_search para buscar "datas comemorativas ${MONTHS[month]} ${year} Brasil" e identifique as relevantes ao nicho.
5. Filtre apenas datas sazonais genuinamente relevantes ao nicho — sem forçar conexões artificiais.
6. Sem datas relevantes numa semana → crie pautas estratégicas originais baseadas no cérebro do cliente.
7. NUNCA invente datas — use somente as encontradas na busca.
8. Toda pauta deve ter conexão clara com os objetivos do cliente.
9. Varie os formatos ao longo do mês — não repita o mesmo formato 4 vezes.
10. A descrição deve ser rica e densa — mínimo 3 linhas com diretrizes claras de copy e criação.

FORMATO DE RESPOSTA: Retorne SOMENTE JSON válido, sem markdown, sem blocos de código, sem texto fora do JSON.
{
  "overview": "Análise estratégica do mês — justificativa das escolhas, gancho de cada semana e estratégia geral",
  "pautas": [
    {
      "week": 1,
      "weekLabel": "Semana 1 — 01 a 07 de ${MONTHS[month]}",
      "title": "Título impactante e criativo",
      "seasonalDate": "Data sazional ou null",
      "theme": "Tema central em 3-5 palavras",
      "format": "Post / Reels / Carrossel / Artigo / Stories",
      "objective": "Engajamento / Conversão / Educação / Autoridade",
      "description": "Descrição rica: diretrizes de copy, abordagem criativa, orientações visuais e linguagem sugerida",
      "cta": "Call to action direto e persuasivo",
      "hashtags": "#hashtag1 #hashtag2 #hashtag3 #hashtag4 #hashtag5"
    }
  ]
}`;

      const msg = `Gere 4 pautas semanais para ${MONTHS[month]} de ${year}.

CÉREBRO DO CLIENTE:
• Nome: ${client.name}
• Nicho: ${client.niche}
• Descrição: ${client.description||'Não informado'}
• Público-alvo: ${client.audience||'Não informado'}
• Tom de voz: ${client.tone}
• Objetivos: ${client.objectives||'Não informado'}
• Palavras-chave: ${client.keywords||'Não informado'}
• Temas proibidos: ${client.forbidden||'Nenhum'}
• Referências: ${client.notes||'Não informado'}

HISTÓRICO DE PAUTAS (NÃO REPITA NENHUM TEMA OU ABORDAGEM):
${history||'Primeira geração — seja especialmente impactante e inovador!'}

Primeiro, use web_search para buscar as datas comemorativas reais de ${MONTHS[month]} ${year} no Brasil. Depois gere as 4 pautas. Retorne APENAS o JSON.`;

      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key': apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:4000,
          system:sys,
          tools:[{type:'web_search_20250305',name:'web_search'}],
          messages:[{role:'user',content:msg}]
        })
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(()=>({}));
        throw new Error(errData.error?.message || `Erro HTTP ${resp.status}`);
      }

      const data = await resp.json();
      clearInterval(iv); setProgress(95);

      let txt='';
      for (const b of (data.content||[])) { if (b.type==='text') txt+=b.text; }
      txt=txt.replace(/```json|```/g,'').trim();
      const i1=txt.indexOf('{'), i2=txt.lastIndexOf('}');
      if (i1>=0&&i2>=0) txt=txt.slice(i1,i2+1);
      const parsed=JSON.parse(txt);
      setResult(parsed); setProgress(100);
    } catch(e) {
      clearInterval(iv);
      setError('Erro ao gerar pautas: '+e.message+'. Verifique sua chave de API e seus créditos em console.anthropic.com.');
    } finally { setLoading(false); }
  }

  function savePautas() {
    if (!result) return;
    const newP = result.pautas.map(p=>({
      ...p, id:'p_'+Date.now()+'_'+p.week,
      clientId, month, year,
      status:'A fazer', commentHistory:[],
      createdAt:new Date().toISOString(), createdBy:user.id
    }));
    const upd=[...pautas,...newP]; lsSet('pautas',upd); setPautas(upd); setSaved(true);
  }

  function exportPDF() {

    const w=window.open('','_blank');
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pautas ${client.name} — ${MONTHS[month]} ${year}</title>

function KanbanPanel({ user, clients, pautas, setPautas }) {
  const mine = user.role==='admin' ? clients : clients.filter(c=>c.assignedTo===user.id);
  const now = new Date();
  const [fClient, setFClient] = useState('all');
  const [fMonth, setFMonth] = useState(now.getMonth());
  const [fYear, setFYear] = useState(now.getFullYear());
  const [sel, setSel] = useState(null);
  const [comment, setComment] = useState('');

  const filtered = pautas.filter(p=>
    (fClient==='all'||p.clientId===fClient) &&
    p.month===fMonth && p.year===fYear &&
    mine.find(c=>c.id===p.clientId)
  );

  function updStatus(id, status) {
    const upd=pautas.map(p=>p.id===id?{...p,status}:p);
    lsSet('pautas',upd); setPautas(upd);
    if (sel?.id===id) setSel(prev=>({...prev,status}));
  }

  function addComment(id) {
    if (!comment.trim()) return;
    const nc={text:comment,author:user.name,date:new Date().toLocaleDateString('pt-BR'),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
    const upd=pautas.map(p=>p.id===id?{...p,commentHistory:[...(p.commentHistory||[]),nc]}:p);
    lsSet('pautas',upd); setPautas(upd);
    setSel(upd.find(p=>p.id===id)); setComment('');
  }

  return (
    <div className="content">
      <div className="flex items-center gap12 mb16" style={{flexWrap:'wrap'}}>
        <select className="form-select" style={{width:'auto'}} value={fClient} onChange={e=>setFClient(e.target.value)}>
          <option value="all">Todos os clientes</option>
          {mine.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select className="form-select" style={{width:'auto'}} value={fMonth} onChange={e=>setFMonth(+e.target.value)}>
          {MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}
        </select>
        <select className="form-select" style={{width:'auto'}} value={fYear} onChange={e=>setFYear(+e.target.value)}>
          {[2025,2026,2027].map(y=><option key={y}>{y}</option>)}
        </select>
        <span className="text-sm">{filtered.length} pauta(s)</span>
      </div>
      {filtered.length===0
        ? <div className="empty-state"><div className="empty-icon">🗂️</div><div className="empty-title">Nenhuma pauta neste período</div><div className="empty-sub">Gere e salve pautas para gerenciá-las aqui</div></div>
        : <div className="kanban-wrap"><div className="kanban">
            {STATUS_LIST.map(status=>{
              const col=filtered.filter(p=>p.status===status);
              return (
                <div key={status} className="kanban-col">
                  <div className="kanban-col-title">{status} <span style={{opacity:0.5,fontWeight:400}}>({col.length})</span></div>
                  {col.map(p=>{
                    const c=mine.find(cl=>cl.id===p.clientId);
                    return (
                      <div key={p.id} className="kanban-card" onClick={()=>setSel(p)}>
                        <div className="kanban-card-title">{p.title}</div>
                        <div className="kanban-card-sub">{c?.name||'—'} · Sem. {p.week}</div>
                        <div style={{marginTop:5}}><Badge text={p.format} type="badge-blue"/></div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div></div>
      }
      {sel&&(
        <div className="modal-overlay" onClick={()=>setSel(null)}>
          <div className="modal" style={{width:540}} onClick={e=>e.stopPropagation()}>
            <div className="modal-title">{sel.title}<button className="modal-close" onClick={()=>setSel(null)}>×</button></div>
            <div className="pauta-week" style={{marginBottom:8}}>{sel.weekLabel}</div>
            <div className="pauta-meta" style={{marginBottom:12}}>
              <Badge text={sel.format} type="badge-blue"/><Badge text={sel.objective} type="badge-orange"/><Badge text={sel.theme||''} type="badge-gray"/>
            </div>
            <p style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.75,marginBottom:14,whiteSpace:'pre-wrap'}}>{sel.description}</p>
            <div className="cta-block" style={{marginBottom:16}}><strong>Call to Action</strong>{sel.cta}</div>
            <div className="form-group">
              <label className="form-label">Alterar status</label>
              <select className="form-select" value={sel.status} onChange={e=>updStatus(sel.id,e.target.value)}>
                {STATUS_LIST.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <hr className="divider"/>
            <div className="form-label" style={{marginBottom:10}}>Comentários ({(sel.commentHistory||[]).length})</div>
            <div style={{maxHeight:180,overflowY:'auto',marginBottom:12}}>
              {(sel.commentHistory||[]).length===0
                ? <p className="text-sm" style={{marginBottom:8}}>Nenhum comentário ainda.</p>
                : (sel.commentHistory||[]).map((cm,i)=>(
                    <div key={i} className="comment-item">
                      <div className="comment-meta"><strong>{cm.author}</strong><span>{cm.date} às {cm.time}</span></div>
                      <div className="comment-text">{cm.text}</div>
                    </div>
                  ))
              }
            </div>
            <div style={{display:'flex',gap:8}}>
              <input className="form-input" style={{flex:1}} value={comment} onChange={e=>setComment(e.target.value)} placeholder="Adicionar comentário..." onKeyDown={e=>e.key==='Enter'&&addComment(sel.id)}/>
              <button className="btn btn-primary btn-sm" onClick={()=>addComment(sel.id)}>Enviar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
function App() {
  const [apiKey, setApiKey] = useState(()=>lsGet('apikey')||'');
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [clients, setClients] = useState(()=>lsGet('clients')||[]);
  const [pautas, setPautas] = useState(()=>lsGet('pautas')||[]);
  const [selClient, setSelClient] = useState(null);

  // Sync clients/pautas changes to localStorage
  useEffect(()=>{ lsSet('clients',clients); },[clients]);
  useEffect(()=>{ lsSet('pautas',pautas); },[pautas]);

  if (!apiKey) return <ApiKeySetup onSave={k=>setApiKey(k)}/>;
  if (!user) return <LoginScreen onLogin={setUser}/>;

  const mine = user.role==='admin' ? clients : clients.filter(c=>c.assignedTo===user.id);

  const PAGES_INFO = {
    dashboard: ['Dashboard','Visão geral da plataforma'],
    clients: ['Clientes','Gerencie o cérebro de cada cliente'],
    generator: ['Gerar Pauta','IA analítica para criação de pautas mensais'],
    kanban: ['Gestão de Pautas','Acompanhe e atualize o status das pautas'],
    users: ['Usuários','Gerencie os operadores do sistema'],
    'client-detail': [selClient?.name||'', selClient?.niche||''],
  };
  const [title, subtitle] = PAGES_INFO[page]||['AgendaSearch',''];

  function nav(p) { setPage(p); setSelClient(null); }

  function handleLogout() {
    setUser(null); setPage('dashboard');
  }

  function handleChangeApiKey() {
    if (window.confirm('Tem certeza que deseja trocar a chave de API?')) {
      lsSet('apikey',''); setApiKey(''); setUser(null);
    }
  }

  return (
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-logo">
          <h1>Agenda<span>Search</span></h1>
          <p>Pautas inteligentes com IA</p>
        </div>
        <div className="sidebar-nav">
          <div className="nav-section-title">Principal</div>
          {[
            {id:'dashboard',icon:'home',label:'Dashboard'},
            {id:'clients',icon:'client',label:'Clientes'},
            {id:'generator',icon:'gen',label:'Gerar Pauta'},
            {id:'kanban',icon:'kanban',label:'Gestão de Pautas'},
          ].map(n=>(
            <div key={n.id} className={`nav-item ${(page===n.id||(page==='client-detail'&&n.id==='clients'))?'active':''}`} onClick={()=>nav(n.id)}>
              <span style={{display:'flex',width:15,height:15}}>{I[n.icon]}</span>{n.label}
            </div>
          ))}
          {user.role==='admin'&&(
            <>
              <div className="nav-section-title" style={{marginTop:16}}>Administração</div>
              <div className={`nav-item ${page==='users'?'active':''}`} onClick={()=>nav('users')}>
                <span style={{display:'flex',width:15,height:15}}>{I.users}</span>Usuários
              </div>
            </>
          )}
          <div className="nav-section-title" style={{marginTop:16}}>Sistema</div>
          <div className="nav-item" onClick={handleChangeApiKey}>
            <span style={{display:'flex',width:15,height:15}}>{I.key}</span>Trocar API Key
          </div>
        </div>
        <div className="sidebar-user">
          <div className="sidebar-user-row">
            <div className="avatar">{user.name[0]}</div>
            <div><div className="user-name">{user.name}</div><div className="user-role">{user.role==='admin'?'Administrador':'Operador'}</div></div>
          </div>
          <button className="logout-btn" onClick={handleLogout}>Sair da conta</button>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div><h2>{title}</h2>{subtitle&&<p>{subtitle}</p>}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="text-sm">{mine.length} cliente(s)</span>
            <Badge text={`${pautas.filter(p=>mine.find(c=>c.id===p.clientId)).length} pautas`} type="badge-gray"/>
          </div>
        </div>

        {page==='dashboard'&&<Dashboard user={user} clients={clients} pautas={pautas}/>}
        {page==='clients'&&<ClientsPanel user={user} clients={clients} setClients={setClients} onSelect={c=>{setSelClient(c);setPage('client-detail');}}/>}
        {page==='client-detail'&&selClient&&<ClientDetail client={selClient} clients={clients} setClients={setClients} pautas={pautas} onBack={()=>setPage('clients')}/>}
        {page==='generator'&&<GeneratorPanel user={user} clients={clients} pautas={pautas} setPautas={setPautas} apiKey={apiKey}/>}
        {page==='kanban'&&<KanbanPanel user={user} clients={clients} pautas={pautas} setPautas={setPautas}/>}
        {page==='users'&&user.role==='admin'&&<UsersPanel/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
